<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-top">
            <ul>
                <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="dashboard.html"><i class="fas fa-user"></i> Profile</a></li>
                <li><a href="#skills"><i class="fas fa-list"></i> Skill Listings</a></li>
                <li><a href="#chat"><i class="fas fa-comments"></i> Chat</a></li>
                <li><a href="#blog"><i class="fas fa-blog"></i> Blog</a></li>
                <li><a href="#notifications"><i class="fas fa-bell"></i> Notifications</a></li>
                <li><a href="#settings" class="active"><i class="fas fa-cog"></i> Settings</a></li>
            </ul>
        </div>
        <div class="sidebar-bottom">
            <ul>
                <li><a href="#logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </div>
    </aside>

    <main class="main-content">
        <header class="settings-header">
            <h1>Settings</h1>
            <p>Manage your account, preferences, and privacy settings</p>
        </header>

        <div class="settings-container">
            <!-- Account Settings Section -->
            <section class="settings-section">
                <h2>Account Settings</h2>
                <form>
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Update your username">
                    
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Update your email">
                    
                    <button type="submit" class="settings-btn">Save Changes</button>
                </form>
            </section>

            <!-- Notification Preferences Section -->
            <section class="settings-section">
                <h2>Notification Preferences</h2>
                <div class="setting-item">
                    <label for="email-notifications">Email Notifications</label>
                    <input type="checkbox" id="email-notifications" checked>
                </div>
                <div class="setting-item">
                    <label for="sms-notifications">SMS Notifications</label>
                    <input type="checkbox" id="sms-notifications">
                </div>
                <div class="setting-item">
                    <label for="push-notifications">Push Notifications</label>
                    <input type="checkbox" id="push-notifications" checked>
                </div>
            </section>

            <!-- Privacy Settings Section -->
            <section class="settings-section">
                <h2>Privacy Settings</h2>
                <div class="setting-item">
                    <label for="profile-visibility">Profile Visibility</label>
                    <select id="profile-visibility">
                        <option value="public">Public</option>
                        <option value="private">Private</option>
                        <option value="friends">Friends Only</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label for="data-sharing">Data Sharing</label>
                    <input type="checkbox" id="data-sharing">
                </div>
            </section>
        </div>
    </main>

    <script defer src="settings.js"></script>
</body>
</html>
