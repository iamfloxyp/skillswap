<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Out</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-top">
            <ul>
                <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="dashboard.html"><i class="fas fa-user"></i> Profile</a></li>
                <li><a href="#skills"><i class="fas fa-list"></i> Skill Listings</a></li>
                <li><a href="#chat"><i class="fas fa-comments"></i> Chat</a></li>
                <li><a href="#blog"><i class="fas fa-blog"></i> Blog</a></li>
                <li><a href="#notifications"><i class="fas fa-bell"></i> Notifications</a></li>
                <li><a href="#settings"><i class="fas fa-cog"></i> Settings</a></li>
                <li><a href="#logout" class="active"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </div>
    </aside>

    <main class="main-content">
        <div class="logout-container">
            <h1>Log Out</h1>
            <p>Are you sure you want to log out?</p>
            <div class="logout-buttons">
                <button id="confirm-logout-btn" class="logout-btn confirm-btn">Log Out</button>
            </div>
        </div>

        <!-- Popup Modal -->
        <div id="popup-modal" class="popup-modal hidden">
            <div class="popup-content">
                <p>Are you sure you want to log out?</p>
                <div class="popup-buttons">
                    <button id="yes-btn" class="popup-btn yes-btn">Yes</button>
                    <button id="no-btn" class="popup-btn no-btn">No</button>
                </div>
            </div>
        </div>
    </main>

    <script defer src="logout.js"></script>
</body>
</html>
